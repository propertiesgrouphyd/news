
name: VIDHWAAN NEWS GITHUB PAGES DEPLOY

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vidhwaan-news-github-pages
  cancel-in-progress: true

jobs:

  # ============================================================
  # BUILD AND UPLOAD
  # ============================================================

  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ------------------------------------------------------------
      # INSTALL TOOLS
      # ------------------------------------------------------------

      - name: Install Tools
        run: |
          set -euo pipefail

          npm install -g terser
          npm install -g javascript-obfuscator
          npm install -g clean-css-cli
          npm install -g html-minifier-terser

          terser --version
          javascript-obfuscator --version
          cleancss --version
          html-minifier-terser --version

      # ------------------------------------------------------------
      # PREPARE DIST
      # ------------------------------------------------------------

      - name: Prepare Dist
        run: |
          set -euo pipefail

          rm -rf dist

          mkdir -p dist
          mkdir -p dist/data/output/news

          cp index.html dist/
          cp main.css dist/
          cp app.js dist/
          cp sw.js dist/
          cp manifest.json dist/

          cp -r icons dist/

          if [ -d data/output/news ]; then
            cp -r data/output/news/. dist/data/output/news/
          fi

          if [ -f CNAME ]; then
            cp CNAME dist/CNAME
          fi

          echo "Production source prepared."

      # ------------------------------------------------------------
      # MINIFY CSS
      # ------------------------------------------------------------

      - name: Minify CSS
        run: |
          set -euo pipefail

          cleancss \
            -O2 \
            dist/main.css \
            -o dist/main.css

          node <<'NODE'
          const fs = require("fs");

          const file = "dist/main.css";

          const source = fs.readFileSync(file, "utf8");

          fs.writeFileSync(
            file,
            source.replace(/\r?\n|\r/g, "").trim(),
            "utf8"
          );
          NODE

      # ------------------------------------------------------------
      # MINIFY JAVASCRIPT
      # ------------------------------------------------------------

      - name: Minify JavaScript
        run: |
          set -euo pipefail

          terser dist/app.js \
            --compress \
            --mangle \
            -o dist/app.js

      # ------------------------------------------------------------
      # OBFUSCATE JAVASCRIPT
      # ------------------------------------------------------------

      - name: Obfuscate JavaScript
        run: |
          set -euo pipefail

          javascript-obfuscator dist/app.js \
            --output dist/app.js \
            --compact true \
            --control-flow-flattening true \
            --control-flow-flattening-threshold 0.75 \
            --dead-code-injection true \
            --dead-code-injection-threshold 0.2 \
            --disable-console-output true \
            --identifier-names-generator hexadecimal \
            --rename-globals false \
            --self-defending true \
            --split-strings true \
            --string-array true \
            --string-array-encoding base64

      # ------------------------------------------------------------
      # GENERATE ASSET VERSION
      # ------------------------------------------------------------

      - name: Generate Asset Version
        run: |
          set -euo pipefail

          VERSION=$(date +%s)

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          echo "Asset version: $VERSION"

      # ------------------------------------------------------------
      # CACHE BUSTING
      # ------------------------------------------------------------

      - name: Cache Busting
        run: |
          set -euo pipefail

          sed -i \
            "s|main.css|main.css?v=$VERSION|g" \
            dist/index.html

          sed -i \
            "s|app.js|app.js?v=$VERSION|g" \
            dist/index.html

          sed -i \
            "s|manifest.json|manifest.json?v=$VERSION|g" \
            dist/index.html

          sed -i \
            "s|sw.js?v=VERSION|sw.js?v=$VERSION|g" \
            dist/index.html

      # ------------------------------------------------------------
      # MINIFY HTML
      # ------------------------------------------------------------

      - name: Minify HTML
        run: |
          set -euo pipefail

          html-minifier-terser \
            --collapse-whitespace \
            --remove-comments \
            --remove-redundant-attributes \
            --remove-script-type-attributes \
            --remove-style-link-type-attributes \
            --use-short-doctype \
            --minify-css true \
            --minify-js true \
            dist/index.html \
            -o dist/index.html

          node <<'NODE'
          const fs = require("fs");

          const file = "dist/index.html";

          const source = fs.readFileSync(file, "utf8");

          fs.writeFileSync(
            file,
            source.replace(/\r?\n|\r/g, "").trim(),
            "utf8"
          );
          NODE

      # ------------------------------------------------------------
      # VERIFY HTML AND CSS
      # ------------------------------------------------------------

      - name: Verify HTML And CSS
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("fs");

          for (const file of [
            "dist/index.html",
            "dist/main.css"
          ]) {
            const data = fs.readFileSync(file);

            for (const byte of data) {
              if (byte === 10 || byte === 13) {
                throw new Error(`${file} is not single-line.`);
              }
            }

            console.log(`OK: ${file}`);
          }
          NODE

      # ------------------------------------------------------------
      # FINAL BUILD VERIFICATION
      # ------------------------------------------------------------

      - name: Verify Production Build
        run: |
          set -euo pipefail

          test -f dist/index.html
          test -f dist/main.css
          test -f dist/app.js
          test -f dist/sw.js
          test -f dist/manifest.json

          test -d dist/icons
          test -d dist/data/output/news

          if [ -f CNAME ]; then
            test -f dist/CNAME
          fi

          node --check dist/app.js
          node --check dist/sw.js

          SOURCE_NEWS_COUNT=0
          DEPLOYED_NEWS_COUNT=0

          if [ -d data/output/news ]; then
            SOURCE_NEWS_COUNT=$(
              find data/output/news -type f | wc -l
            )
          fi

          DEPLOYED_NEWS_COUNT=$(
            find dist/data/output/news -type f | wc -l
          )

          echo "Source news files: $SOURCE_NEWS_COUNT"
          echo "Deployed news files: $DEPLOYED_NEWS_COUNT"

          if [ "$SOURCE_NEWS_COUNT" -ne "$DEPLOYED_NEWS_COUNT" ]; then
            echo "ERROR: News data count mismatch."
            exit 1
          fi

          test ! -d dist/.github
          test ! -d dist/scripts

          grep -Fq "main.css?v=${VERSION}" dist/index.html
          grep -Fq "app.js?v=${VERSION}" dist/index.html
          grep -Fq "manifest.json?v=${VERSION}" dist/index.html

          echo "PRODUCTION BUILD PASSED"

          find dist -type f | sort

      # ------------------------------------------------------------
      # CONFIGURE PAGES
      # ------------------------------------------------------------

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # ------------------------------------------------------------
      # UPLOAD PAGES ARTIFACT
      # ------------------------------------------------------------

      - name: Upload GitHub Pages Artifact
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: ./dist
          retention-days: 1

      # ------------------------------------------------------------
      # VERIFY ARTIFACT ID
      # ------------------------------------------------------------

      - name: Verify Uploaded Artifact
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          set -euo pipefail

          if [ -z "$ARTIFACT_ID" ]; then
            echo "ERROR: GitHub Pages artifact ID is empty."
            exit 1
          fi

          echo "Artifact upload successful."
          echo "Artifact ID: $ARTIFACT_ID"
          echo "Artifact name: github-pages"

  # ============================================================
  # DEPLOY
  # ============================================================

  deploy:
    needs: build

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy To GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages

      - name: Deployment Success
        run: |
          echo "============================================================"
          echo " VIDHWAAN NEWS — DEPLOYMENT SUCCESS"
          echo "============================================================"

          echo "Deployment URL: ${{ steps.deployment.outputs.page_url }}"
          echo "Artifact: github-pages"
          echo "Deployment: GitHub Pages"

          echo "============================================================"
