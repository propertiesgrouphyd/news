name: VIDHWAAN NEWS PWA DEPLOY

on:
  push:
    branches:
      - main

  workflow_dispatch:


permissions:
  contents: read


jobs:

  deploy:

    runs-on: ubuntu-latest

    env:
      PROJECT_NAME: vidhwaan-news


    steps:


      - name: Checkout Repository
        uses: actions/checkout@v4



      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22



      - name: Install Tools
        run: |
          npm install -g wrangler
          npm install -g terser
          npm install -g javascript-obfuscator
          npm install -g clean-css-cli
          npm install -g html-minifier-terser



      - name: Prepare Dist

        run: |

          rm -rf dist

          mkdir dist

          cp index.html dist/
          cp main.css dist/
          cp app.js dist/
          cp sw.js dist/
          cp manifest.json dist/

          cp -r icons dist/

          mkdir -p dist/data/output/news

          cp -r data/output/news/* dist/data/output/news/ || true



      - name: Minify HTML

        run: |

          html-minifier-terser \
          --collapse-whitespace \
          --remove-comments \
          --remove-redundant-attributes \
          dist/index.html \
          -o dist/index.html



      - name: Minify CSS

        run: |

          cleancss \
          -O2 \
          dist/main.css \
          -o dist/main.css



      - name: Minify JavaScript

        run: |

          terser dist/app.js \
          --compress \
          --mangle \
          -o dist/app.js



      - name: Obfuscate JavaScript

        run: |

          javascript-obfuscator dist/app.js \
          --output dist/app.js \
          --compact true \
          --control-flow-flattening true \
          --control-flow-flattening-threshold 0.75 \
          --dead-code-injection true \
          --dead-code-injection-threshold 0.2 \
          --disable-console-output true \
          --identifier-names-generator hexadecimal \
          --rename-globals false \
          --self-defending true \
          --split-strings true \
          --string-array true \
          --string-array-encoding base64



      - name: Cache Busting

        run: |


          VERSION=$(date +%s)

          sed -i "s|main.css|main.css?v=$VERSION|g" dist/index.html

          sed -i "s|app.js|app.js?v=$VERSION|g" dist/index.html

          sed -i "s|manifest.json|manifest.json?v=$VERSION|g" dist/index.html

          sed -i "s|sw.js?v=VERSION|sw.js?v=$VERSION|g" dist/index.html



      - name: Create Headers

        run: |

          echo '/*' > dist/_headers

          echo '  X-Content-Type-Options: nosniff' >> dist/_headers

          echo '  X-Frame-Options: SAMEORIGIN' >> dist/_headers

          echo '  Referrer-Policy: strict-origin-when-cross-origin' >> dist/_headers

          echo '' >> dist/_headers

          echo '/data/output/news/*' >> dist/_headers

          echo '  Cache-Control: no-store, max-age=0' >> dist/_headers

          echo '' >> dist/_headers

          echo '/*.js' >> dist/_headers

          echo '  Cache-Control: public, max-age=31536000' >> dist/_headers

          echo '' >> dist/_headers

          echo '/*.css' >> dist/_headers

          echo '  Cache-Control: public, max-age=31536000' >> dist/_headers



      - name: Create Cloudflare Project

        env:

          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}


        run: |

          if ! wrangler pages project list | grep -q "$PROJECT_NAME"
          then

            wrangler pages project create "$PROJECT_NAME" \
            --production-branch main

          else

            echo "Project exists"

          fi



      - name: Deploy Cloudflare Pages

        env:

          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}


        run: |

          wrangler pages deploy dist \
          --project-name="$PROJECT_NAME"



      - name: Success

        run: |

          echo "VIDHWAAN NEWS DEPLOYED SUCCESSFULLY"
